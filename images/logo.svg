<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="cRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52D27"/>
      <stop offset="100%" stop-color="#B31217"/>
    </linearGradient>
    <linearGradient id="cGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2B48"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Emblem Icon: Stylized Interlocking C Monogram with Quality Checkmark -->
  <g transform="translate(10, 8)" filter="url(#subtleShadow)">
    <!-- Red Outer Ring Crescent -->
    <path d="M 40 4 A 28 28 0 1 0 62 48 L 51 43 A 18 18 0 1 1 38 14 Z" fill="url(#cRedGrad)" />
    <!-- Green Accent Swoosh -->
    <path d="M 28 32 A 16 16 0 0 1 48 18 L 52 26 A 8 8 0 0 0 34 38 Z" fill="url(#cGreenGrad)" />
    <!-- Quality Seal Badge -->
    <circle cx="50" cy="50" r="11" fill="#10B981" />
    <path d="M 45 50 L 48.5 53.5 L 55 46.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: Cəsarətoğlu MMC -->
  <g transform="translate(85, 48)">
    <text font-family="'Outfit', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="31" font-weight="800" fill="url(#cBlueGrad)" letter-spacing="-0.5">
      Cəsarətoğlu
    </text>
    <text x="192" y="-2" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#E52D27" letter-spacing="1">
      MMC
    </text>
    <!-- Subtitle -->
    <text x="2" y="18" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="1.8" text-transform="uppercase">
      QİDA SƏNAYESİ TƏCHİZATI • B2B
    </text>
  </g>
</svg>
